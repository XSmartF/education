name: deploy-firebase-app-distribution

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
      FIREBASE_GROUPS: ${{ secrets.FIREBASE_GROUPS }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      EAS_NO_VCS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: mobile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Ensure required secrets
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing EXPO_TOKEN"; exit 1; fi
          if [ -z "$FIREBASE_APP_ID_ANDROID" ]; then
            echo "Missing FIREBASE_APP_ID_ANDROID"; exit 1; fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON"; exit 1; fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing ANDROID_KEY_PASSWORD"; exit 1; fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Missing ANDROID_KEY_ALIAS"; exit 1; fi

      - name: Prepare Android keystore (local credentials)
        shell: bash
        run: |
          mkdir -p mobile/android/keystores
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/android/keystores/release.keystore
          cat > mobile/credentials.json <<EOF
          {"android":{"keystore":{"keystorePath":"android/keystores/release.keystore","keystorePassword":"${ANDROID_KEYSTORE_PASSWORD}","keyAlias":"${ANDROID_KEY_ALIAS}","keyPassword":"${ANDROID_KEY_PASSWORD}"}}}
          EOF

      - name: Build Android (EAS)
        working-directory: mobile
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download APK
        working-directory: mobile
        shell: bash
        run: |
          mkdir -p build
          eas --version || true
          # Capture EAS output and exit code before attempting to parse JSON
          output=$(eas build:list --platform android --limit 1 --build-profile preview --json --non-interactive 2>&1) || rc=$?
          rc=${rc:-0}
          if [ "$rc" -ne 0 ]; then
            echo "EAS command failed with exit code $rc"
            echo "$output"
            exit $rc
          fi
          build_url=$(printf '%s' "$output" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const start=d.search(/[\\[\\{]/);const end=Math.max(d.lastIndexOf(']'),d.lastIndexOf('}'));if(start===-1||end<start){console.error('No JSON found in EAS output');console.error(d);process.exit(2);}const json=d.slice(start,end+1).trim();let data;try{data=JSON.parse(json||'[]')}catch(e){console.error('EAS output is not JSON:',json);process.exit(2);}const url=data?.[0]?.artifacts?.buildUrl||data?.[0]?.artifacts?.applicationArchiveUrl;if(!url){console.error('Missing buildUrl in EAS build list output');process.exit(1);}console.log(url);});")
          echo "Downloading APK from $build_url"
          curl -L -H "Authorization: Bearer $EXPO_TOKEN" -o build/app.apk "$build_url"

      - name: Write Firebase service account
        shell: bash
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > firebase-service-account.json

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFile: firebase-service-account.json
          file: mobile/build/app.apk
          releaseNotes: "Automated build from GitHub Actions"
          testers: ${{ secrets.FIREBASE_TESTERS }}
          groups: ${{ secrets.FIREBASE_GROUPS }}
