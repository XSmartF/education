name: deploy-monsterasp

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    env:
      ConnectionStrings__Default: ${{ secrets.ConnectionStrings__Default }}
      Jwt__Key: ${{ secrets.Jwt__Key }}
      Email__SmtpUser: ${{ secrets.Email__SmtpUser }}
      Email__SmtpPass: ${{ secrets.Email__SmtpPass }}
      Email__FromEmail: ${{ secrets.Email__FromEmail }}
      Diagnostics__IncludeExceptionDetails: ${{ vars.DIAGNOSTICS_INCLUDE_EXCEPTION_DETAILS }}
    steps:
      - uses: actions/checkout@v4

      - name: Download publish artifact (from CI)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: web-publish
          path: publish

      - name: Download publish artifact (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          branch: main
          name: web-publish
          path: publish

      - name: Inject runtime secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ConnectionStrings__Default)) {
            Write-Error "Missing ConnectionStrings__Default"; exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:Jwt__Key)) {
            Write-Error "Missing Jwt__Key"; exit 1
          }

          $settings = @{
            ConnectionStrings = @{ Default = $env:ConnectionStrings__Default }
            Jwt = @{ Key = $env:Jwt__Key }
          }

          $email = @{}
          if (-not [string]::IsNullOrWhiteSpace($env:Email__SmtpUser)) { $email.SmtpUser = $env:Email__SmtpUser }
          if (-not [string]::IsNullOrWhiteSpace($env:Email__SmtpPass)) { $email.SmtpPass = $env:Email__SmtpPass }
          if (-not [string]::IsNullOrWhiteSpace($env:Email__FromEmail)) { $email.FromEmail = $env:Email__FromEmail }
          if ($email.Count -gt 0) { $settings.Email = $email }

          if (-not [string]::IsNullOrWhiteSpace($env:Diagnostics__IncludeExceptionDetails)) {
            $includeDetails = $false
            if ([bool]::TryParse($env:Diagnostics__IncludeExceptionDetails, [ref]$includeDetails)) {
              $settings.Diagnostics = @{ IncludeExceptionDetails = $includeDetails }
            }
          }

          $json = $settings | ConvertTo-Json -Depth 5
          $json | Set-Content -Path publish/appsettings.Production.json -NoNewline

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.2.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: 'publish'
