name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci || npm install
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: frontend

      - name: Test frontend
        run: npm run test:ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload frontend build (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__Default: ${{ secrets.ConnectionStrings__Default }}
      Jwt__Key: ${{ secrets.Jwt__Key }}
      Email__SmtpUser: ${{ secrets.Email__SmtpUser }}
      Email__SmtpPass: ${{ secrets.Email__SmtpPass }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Education.sln

      - name: Build
        run: dotnet build Education.sln -c Release --no-restore

      - name: Test backend
        run: dotnet test Education.sln -c Release --no-build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci
        working-directory: mobile

      - name: Lint mobile
        run: npm run lint
        working-directory: mobile

      - name: Typecheck
        run: npm run typecheck
        working-directory: mobile

      - name: Test
        run: npm run test
        working-directory: mobile

  publish-web:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend]
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__Default: ${{ secrets.ConnectionStrings__Default }}
      Jwt__Key: ${{ secrets.Jwt__Key }}
      Email__SmtpUser: ${{ secrets.Email__SmtpUser }}
      Email__SmtpPass: ${{ secrets.Email__SmtpPass }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Education.sln

      - name: Publish
        run: dotnet publish backend/src/Api/Api.csproj -c Release -o ./publish --framework net10.0 --no-restore

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-publish
          path: publish
          if-no-files-found: error
